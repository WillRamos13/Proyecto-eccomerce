server.port=${PORT:8080}
spring.application.name=fastmarket-backend

spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fastmarket}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5500}
app.backend.public-url=${BACKEND_PUBLIC_URL:}

app.admin.nombre=${ADMIN_NOMBRE:Administrador}
app.admin.correo=${ADMIN_CORREO:admin@fastmarket.com}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.reset-password=${ADMIN_RESET_PASSWORD:false}

app.auth.secret=${APP_AUTH_SECRET:}
app.auth.token-hours=${APP_AUTH_TOKEN_HOURS:12}
app.pagos.reserva-minutos=${PAGO_RESERVA_MINUTOS:30}
app.pagos.expiracion-check-ms=${PAGO_EXPIRACION_CHECK_MS:60000}

openai.api.key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}

google.gmail.client-id=${GOOGLE_CLIENT_ID:}
google.gmail.client-secret=${GOOGLE_CLIENT_SECRET:}
google.gmail.refresh-token=${GOOGLE_REFRESH_TOKEN:}
app.mail.from=${MAIL_FROM:FastMarket <fastmarket@localhost>}
app.verificacion.codigo-minutos=${CODIGO_VERIFICACION_MINUTOS:10}

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}

mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
