spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Render termina TLS en su proxy y reenvía la petición al contenedor.
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true

# Pool conservador para instancias pequeñas/medianas de PostgreSQL.
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# En Render estas propiedades se derivan automáticamente de
# RENDER_EXTERNAL_HOSTNAME, salvo que se sobrescriban manualmente.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
app.frontend.base-url=${FRONTEND_BASE_URL:}
app.backend.public-url=${BACKEND_PUBLIC_URL:}
app.auth.secret=${APP_AUTH_SECRET}
app.admin.password=${ADMIN_PASSWORD}
